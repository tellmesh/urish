[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urish"
version = "0.1.0"
description = "Unified URI shell facade over uri3, uri2run, uri2ops, hypervisor, urigen"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.26.7",
    "uri2run",
    "uri2flow",
    "uri2ops",
    "uri3",
    "nl2uri",
    "resource-agent-hypervisor",
    "urigen",
]

[project.optional-dependencies]
dashboard = ["hypervisor-dashboard-agent"]

[project.scripts]
uri = "urish.cli:main"
urish = "urish.cli:main"
taskinity = "urish.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["urish*"]

[tool.uv.sources]
uri2run = { git = "https://github.com/tellmesh/uri2run.git" }
uri2flow = { git = "https://github.com/tellmesh/uri2flow.git" }
uri2ops = { git = "https://github.com/tellmesh/uri2ops.git" }
uri3 = { git = "https://github.com/tellmesh/uri3.git" }
nl2uri = { git = "https://github.com/tellmesh/nl2uri.git" }
urigen = { git = "https://github.com/tellmesh/urigen.git" }

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
