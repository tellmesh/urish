[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urish"
version = "0.1.0"
description = "Unified URI shell facade over uri3, uri2run, uri2ops, hypervisor, urigen"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.26.7",
    "uri2run",
    "uri2flow",
    "uri2ops",
    "uri3",
    "nl2uri",
    "resource-agent-hypervisor",
    "hypervisor-dashboard-agent",
    "urigen",
]

[project.scripts]
uri = "urish.cli:main"
urish = "urish.cli:main"
taskinity = "urish.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["urish*"]

[tool.uv.sources]
uri2run = { git = "https://github.com/tellmesh/uri2run.git" }
uri2flow = { git = "https://github.com/tellmesh/uri2flow.git" }
uri2ops = { git = "https://github.com/tellmesh/uri2ops.git" }
uri3 = { git = "https://github.com/tellmesh/uri3.git" }
nl2uri = { git = "https://github.com/tellmesh/nl2uri.git" }
urigen = { git = "https://github.com/tellmesh/urigen.git" }
resource-agent-hypervisor = { git = "https://github.com/wronai/hypervisor.git", subdirectory = "packages/resource-agent-hypervisor" }
hypervisor-dashboard-agent = { git = "https://github.com/wronai/hypervisor.git", subdirectory = "agents/system/hypervisor_dashboard" }
